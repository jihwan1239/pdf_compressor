name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name PDFCompressor
          --icon app.ico
          --version-file version_info.txt
          --add-data "app.ico;."
          pdf_compressor.py

      - name: SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/PDFCompressor.exe -Algorithm SHA256).Hash
          "$h  PDFCompressor.exe" | Out-File dist/SHA256.txt -Encoding ascii
          Get-Content dist/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: PDFCompressor
          path: |
            dist/PDFCompressor.exe
            dist/SHA256.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PDFCompressor.exe
            dist/SHA256.txt
